<!doctype html>
<!-- Fuente de la imagen Open Graph (1200x630). Se exporta con scripts/render-brand-assets.ps1 -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0a0a;
        color: #f4f1ec;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        top: -300px;
        right: -260px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 77, 141, 0.22), transparent 62%);
      }
      .copy {
        position: relative;
        width: 700px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.16em;
        color: #ff4d8d;
      }
      h1 {
        margin: 28px 0 0;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 68px;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      h1 span {
        color: #ff4d8d;
      }
      .name {
        margin-top: auto;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      .photo {
        position: absolute;
        right: 90px;
        top: 105px;
        width: 320px;
        height: 420px;
      }
      .photo__shadow,
      .photo__mask {
        position: absolute;
        inset: 0;
        border-radius: 52% 48% 42% 58% / 46% 40% 60% 54%;
      }
      .photo__shadow {
        background: #ff4d8d;
        opacity: 0.22;
        transform: translate(16px, 16px) rotate(-4deg);
      }
      .photo__mask {
        overflow: hidden;
        background: #1a1714;
      }
      .photo__mask img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="copy">
        <div class="eyebrow">CONTENIDO · REDES SOCIALES · VÍDEO</div>
        <h1>Creo contenido<br />que se ve, <span>se entiende<br />y se comparte.</span></h1>
        <div class="name">Estrella Domínguez Sánchez</div>
      </div>
      <div class="photo">
        <div class="photo__shadow"></div>
        <div class="photo__mask"><img src="../src/assets/foto-estrella.png" alt="" /></div>
      </div>
    </div>
  </body>
</html>
